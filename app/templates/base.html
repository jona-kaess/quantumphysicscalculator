<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quantum Physics Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script>
        window.MathJax = {
            tex: { inlineMath: [["\\(", "\\)"]] },
            options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <main class="container">
        <nav class="main-nav" aria-label="Main navigation">
            <a href="{{ url_for('pages.calculator') }}" {% if request.endpoint == 'pages.calculator' %}aria-current="page"{% endif %}>Physics calculator</a>
            <a href="{{ url_for('pages.home') }}" {% if request.endpoint == 'pages.home' %}aria-current="page"{% endif %}>Unit converter</a>
            <a href="{{ url_for('pages.hamiltonians') }}" {% if request.endpoint == 'pages.hamiltonians' %}aria-current="page"{% endif %}>Qubit Hamiltonians</a>
        </nav>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
