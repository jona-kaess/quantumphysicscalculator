plugins { id 'com.android.application' }

android {
    namespace 'de.quantumphysicscalculator'
    compileSdk 35
    defaultConfig {
        applicationId 'de.quantumphysicscalculator'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/webAssets')
}

def copyWebAssets = tasks.register('copyWebAssets', Copy) {
    from('../..') {
        include 'index.html', 'guide.html', 'landing.html', 'manifest.webmanifest', 'service-worker.js', 'assets/**'
    }
    into layout.buildDirectory.dir('generated/webAssets/www')
}
tasks.named('preBuild').configure { dependsOn copyWebAssets }

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
